name: Release

# Automatic: runs after the "CI" workflow finishes successfully on a push to main,
#            then releases the version defined in the gemspec.
#            - 1.1.0.beta1 / 1.1.0.rc1  -> GitHub "Pre-release"
#            - 1.1.0                    -> normal (latest) release
#            Release notes come from the matching section in CHANGELOG.md.
#            (skipped if the tag for that version already exists).
# Manual:    Actions -> Release -> Run workflow. Tick "recreate" to delete the
#            existing tag + release for this version and create them again.
# Does NOT publish to RubyGems: run `gem push <file>.gem` yourself.
on:
  workflow_run:
    workflows: ["CI"]          # must match the `name:` in ci.yml exactly
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      recreate:
        description: "Delete the existing tag/release for this version and create it again"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Tag and release
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      GEMSPEC: respondo-graphql.gemspec   # <- change if your gemspec has a different name
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - uses: ruby/setup-ruby@824c0e29fdfc7d689c191c27acc969d2d04b7dd8 # v1.331.0
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Decide what to do
        id: plan
        env:
          RECREATE: ${{ inputs.recreate }}
        run: |
          # Everything is read from the gemspec, so no version.rb path is needed
          spec_info() { ruby -e "s = Gem::Specification.load('${GEMSPEC}') or abort('cannot load ${GEMSPEC}'); $1"; }

          version="$(spec_info 'puts s.version.to_s')"
          gem_file="$(spec_info 'puts s.full_name + ".gem"')"
          prerelease="$(spec_info 'puts s.version.prerelease?')"
          tag="v${version}"

          {
            echo "version=${version}"
            echo "gem_file=${gem_file}"
            echo "prerelease=${prerelease}"
            echo "tag=${tag}"
          } >> "$GITHUB_OUTPUT"

          echo "Gem file: ${gem_file}"
          if [ "${prerelease}" = "true" ]; then
            echo "Version ${version} is a PRE-RELEASE (beta/rc)"
          else
            echo "Version ${version} is a STABLE release"
          fi

          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            if [ "${RECREATE}" = "true" ]; then
              echo "Tag ${tag} exists: will be recreated as requested"
              echo "release=true" >> "$GITHUB_OUTPUT"
              echo "replace=true" >> "$GITHUB_OUTPUT"
            else
              echo "Tag ${tag} already exists: nothing to release (bump the version to release a new one)"
              echo "release=false" >> "$GITHUB_OUTPUT"
              echo "replace=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "Tag ${tag} does not exist yet: releasing"
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "replace=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run the test suite (manual runs only)
        if: steps.plan.outputs.release == 'true' && github.event_name == 'workflow_dispatch'
        run: bundle exec rspec

      - name: Build the gem
        if: steps.plan.outputs.release == 'true'
        env:
          GEM_FILE: ${{ steps.plan.outputs.gem_file }}
        run: |
          gem build "${GEMSPEC}"
          test -f "${GEM_FILE}" || { echo "::error::Expected ${GEM_FILE} was not built"; ls -la *.gem; exit 1; }

      - name: Extract release notes from CHANGELOG.md
        if: steps.plan.outputs.release == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          awk -v v="${VERSION}" '
            /^## / {
              if (found) exit
              h = $0
              sub(/^## \[?/, "", h)
              sub(/\].*$/, "", h)
              sub(/ .*$/, "", h)
              if (h == v) { found = 1; next }
            }
            found { print }
          ' CHANGELOG.md > "${RUNNER_TEMP}/release_notes.md"

          if ! grep -q '[^[:space:]]' "${RUNNER_TEMP}/release_notes.md"; then
            echo "::error::No entry for ${VERSION} in CHANGELOG.md. Add a '## [${VERSION}]' section and merge again."
            exit 1
          fi

          echo "---- Release notes ----"
          cat "${RUNNER_TEMP}/release_notes.md"

      - name: Remove old tag and release (recreate only)
        if: steps.plan.outputs.replace == 'true'
        env:
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          gh release delete "${TAG}" --yes 2>/dev/null || true
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}"

      - name: Create tag and GitHub Release with the gem attached
        if: steps.plan.outputs.release == 'true'
        env:
          TAG: ${{ steps.plan.outputs.tag }}
          VERSION: ${{ steps.plan.outputs.version }}
          GEM_FILE: ${{ steps.plan.outputs.gem_file }}
          PRERELEASE: ${{ steps.plan.outputs.prerelease }}
        run: |
          if [ "${PRERELEASE}" = "true" ]; then
            channel_flags="--prerelease --latest=false"
            title="respondo-graphql ${VERSION} (pre-release)"
          else
            channel_flags="--latest"
            title="respondo-graphql ${VERSION}"
          fi

          gh release create "${TAG}" "${GEM_FILE}" \
            --target "${RELEASE_SHA}" \
            --title "${title}" \
            --notes-file "${RUNNER_TEMP}/release_notes.md" \
            ${channel_flags}

  # Pushes ONLY to GitHub Packages (rubygems.pkg.github.com), never to rubygems.org.
  # Runs after the release job (even if it skipped the release because the tag exists)
  # and publishes only when this exact version is not already in the registry.
  package:
    name: Publish to GitHub Packages
    needs: release
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write       # read existing versions and push the gem
    env:
      GH_TOKEN: ${{ github.token }}
      OWNER: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Check if this version is already in GitHub Packages
        id: check
        run: |
          gem_version="$(ruby -r ./lib/respondo-graphql/version -e 'puts Gem::Version.new(RespondoGraphql::VERSION).to_s')"
          echo "gem_version=${gem_version}" >> "$GITHUB_OUTPUT"

          # Package not created yet -> API returns 404 -> empty list -> publish
          existing="$(gh api --paginate "users/${OWNER}/packages/rubygems/respondo-graphql/versions" --jq '.[].name' 2>/dev/null || true)"

          if printf '%s\n' "${existing}" | grep -Fxq "${gem_version}"; then
            echo "respondo-graphql ${gem_version} is already in GitHub Packages: skipping"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "respondo-graphql ${gem_version} is not in GitHub Packages yet: publishing"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the gem
        if: steps.check.outputs.publish == 'true'
        run: gem build respondo-graphql.gemspec

      - name: Publish gem to GitHub Packages
        if: steps.check.outputs.publish == 'true'
        env:
          GEM_VERSION: ${{ steps.check.outputs.gem_version }}
        run: |
          mkdir -p ~/.gem
          printf -- "---\n:github: Bearer %s\n" "${GH_TOKEN}" > ~/.gem/credentials
          chmod 0600 ~/.gem/credentials

          gem push "respondo-graphql-${GEM_VERSION}.gem" \
            --key github \
            --host "https://rubygems.pkg.github.com/${OWNER}"

          rm -f ~/.gem/credentials